<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screen Capture AI</title>
    <style>
        :root {
            --bg-base: #0a0e17;
            --bg-surface: #111827;
            --bg-card: #162032;
            --bg-input: #0b111e;
            --border: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 255, 255, 0.16);
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --radius-sm: 6px;
            --radius-md: 9px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 420px;
            max-height: 580px;
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-base);
            color: var(--text-primary);
            overflow-y: auto;
        }

        body::-webkit-scrollbar {
            width: 4px;
        }
        body::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 2px;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 14px;
        }

        .header-brand {
            display: flex;
            flex-direction: column;
        }

        .header-title {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: -0.2px;
            color: #fff;
        }

        .header-subtitle {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 1px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-icon {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 5px 10px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            text-decoration: none;
        }

        .btn-icon:hover {
            background: #1e293b;
            color: #fff;
            border-color: var(--border-hover);
        }

        .badge-status {
            font-size: 11px;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 12px;
            background: rgba(59, 130, 246, 0.12);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.25);
        }

        /* Mode Selector */
        .mode-wrapper {
            margin-bottom: 12px;
        }

        .mode-segmented {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            background: var(--bg-input);
            padding: 3px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
        }

        .mode-btn {
            background: transparent;
            border: none;
            padding: 6px 4px;
            font-size: 11.5px;
            font-weight: 500;
            color: var(--text-muted);
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.15s;
            text-align: center;
        }

        .mode-btn:hover {
            color: #fff;
        }

        .mode-btn.active {
            background: var(--bg-card);
            color: #fff;
            font-weight: 600;
            border: 1px solid var(--border-hover);
        }

        /* Action Buttons */
        .btn-row {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 8px;
            margin-bottom: 14px;
        }

        .btn {
            padding: 9px 14px;
            border-radius: var(--radius-sm);
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.15s ease;
            text-align: center;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 2px 10px rgba(59, 130, 246, 0.3);
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        .btn-secondary {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-secondary);
        }

        .btn-secondary:hover {
            background: #1e293b;
            color: #fff;
        }

        /* History List */
        .history-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .history-card {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 12px;
            transition: border-color 0.15s ease;
        }

        .history-card:hover {
            border-color: var(--border-hover);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .card-index {
            font-size: 11.5px;
            font-weight: 700;
            color: #60a5fa;
        }

        .card-time {
            font-size: 10.5px;
            color: var(--text-muted);
        }

        .card-title {
            font-size: 12px;
            font-weight: 500;
            color: #e2e8f0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }

        .card-meta {
            font-size: 10.5px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        /* Answer Box & Math Rendering */
        .answer-box {
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 10px 12px;
            margin: 8px 0;
            font-size: 12px;
            line-height: 1.6;
            color: #f1f5f9;
            max-height: 220px;
            overflow-y: auto;
        }

        .math-fraction {
            display: inline-flex;
            flex-direction: column;
            vertical-align: middle;
            text-align: center;
            padding: 0 3px;
            font-size: 0.9em;
            line-height: 1.1;
            font-family: 'Cambria Math', 'Times New Roman', serif;
        }
        .math-num {
            border-bottom: 1.5px solid currentColor;
            padding-bottom: 1px;
        }
        .math-den {
            padding-top: 1px;
        }
        .math-inline {
            font-family: 'Cambria Math', 'Times New Roman', serif;
            font-style: italic;
            color: #93c5fd;
            padding: 0 2px;
        }
        .math-block {
            display: flex;
            justify-content: center;
            margin: 6px 0;
            padding: 6px 10px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 6px;
            font-family: 'Cambria Math', 'Times New Roman', serif;
            color: #60a5fa;
        }
        .md-list {
            margin: 4px 0 6px 18px;
            padding: 0;
        }
        .md-list li {
            margin-bottom: 3px;
        }
        .md-bold {
            color: #fff;
            font-weight: 700;
        }

        .answer-badge {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #60a5fa;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
        }

        .card-actions {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }

        .btn-card-action {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 5px 9px;
            border-radius: var(--radius-sm);
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
        }

        .btn-card-action:hover {
            background: #1e293b;
            color: #fff;
            border-color: var(--border-hover);
        }

        .btn-ai-action {
            background: rgba(59, 130, 246, 0.12);
            color: #60a5fa;
            border-color: rgba(59, 130, 246, 0.3);
        }

        .btn-ai-action:hover {
            background: var(--accent);
            color: #fff;
        }

        .empty-state {
            text-align: center;
            padding: 32px 16px;
            color: var(--text-muted);
            font-size: 12.5px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-brand">
            <div class="header-title">Capture AI</div>
            <div class="header-subtitle" id="currentProviderText">Mô hình: Gemini 3.7 Flash</div>
        </div>
        <div class="header-actions">
            <button id="btnOpenOptions" class="btn-icon">Cài đặt</button>
            <div class="badge-status" id="statusBadge">Sẵn sàng</div>
        </div>
    </div>

    <!-- Mode Selector -->
    <div class="mode-wrapper">
        <div class="mode-segmented">
            <button type="button" class="mode-btn active" data-mode="native-third">1/3 Trang</button>
            <button type="button" class="mode-btn" data-mode="native-full">Toàn trang</button>
            <button type="button" class="mode-btn" data-mode="native-visible">Khung nhìn</button>
        </div>
    </div>

    <!-- Action Buttons -->
    <div class="btn-row">
        <button class="btn btn-primary" id="btnCapture">Chụp & Lưu Cache</button>
        <button class="btn btn-secondary" id="btnClear">Xóa lịch sử</button>
    </div>

    <!-- History List -->
    <div class="history-container" id="historyList">
        <div class="empty-state">
            <div>Chưa có bản chụp nào trong Cache</div>
            <div style="font-size: 11px; margin-top: 4px; color: var(--text-muted);">Bấm Alt+S hoặc nút chụp trên trang để bắt đầu</div>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
